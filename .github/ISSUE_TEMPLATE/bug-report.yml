name: Bug report / device compatibility
description: Report a mobile APK, camera, microphone or OBS issue.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: APK version or commit
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android device, OS and ROM build
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Root manager and LSPosed versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction and expected result
      description: Include the input source, target app, active toggles, resolution and the result of emergency stop if applicable.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Control panel status and device logs
      description: Attach relevant logcat or CameraService output. Remove identifiers and OBS stream keys.
