name: Pixel 5 baseline APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Build a signed baseline release (not a validated virtual-camera backend)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify pinned Gradle wrapper
        run: echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
      - name: Install Android build dependencies
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'
      - name: Unit tests, lint and debug APK
        run: sh gradlew --no-daemon :app-control:testDebugUnitTest :app-control:lintDebug :app-control:assembleDebug
      - name: Verify and package APK
        shell: pwsh
        run: ./scripts/ci/Package-Apk.ps1 -Variant debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LONG-redfin-baseline-debug
          path: dist/debug/
          if-no-files-found: error
          retention-days: 14
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-and-lint-reports
          path: app-control/build/reports/
          retention-days: 14

  release:
    needs: debug
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify wrapper
        run: echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
      - name: Install Android build dependencies
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'
      - name: Build signed release
        shell: pwsh
        env:
          LONG_RELEASE_KEYSTORE_B64: ${{ secrets.LONG_RELEASE_KEYSTORE_B64 }}
          LONG_KEYSTORE_PASSWORD: ${{ secrets.LONG_RELEASE_STORE_PASSWORD }}
          LONG_KEY_ALIAS: ${{ secrets.LONG_RELEASE_KEY_ALIAS }}
          LONG_KEY_PASSWORD: ${{ secrets.LONG_RELEASE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('LONG_RELEASE_KEYSTORE_B64','LONG_KEYSTORE_PASSWORD','LONG_KEY_ALIAS','LONG_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing required secret: $name" }
          }
          $env:LONG_KEYSTORE_PATH = Join-Path $env:RUNNER_TEMP 'long-release.jks'
          try {
            [IO.File]::WriteAllBytes($env:LONG_KEYSTORE_PATH, [Convert]::FromBase64String($env:LONG_RELEASE_KEYSTORE_B64))
            & sh gradlew --no-daemon :app-control:testReleaseUnitTest :app-control:lintRelease :app-control:assembleRelease
            if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
            ./scripts/ci/Package-Apk.ps1 -Variant release
          } finally {
            if (Test-Path -LiteralPath $env:LONG_KEYSTORE_PATH) { Remove-Item -LiteralPath $env:LONG_KEYSTORE_PATH -Force }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LONG-redfin-baseline-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
