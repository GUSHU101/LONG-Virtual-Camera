name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: APK and controller contracts
        run: python -m unittest discover -s tests -v
      - name: Signed release failure and retry tests
        run: bash tests/release_workflow_test.sh
      - name: Root controller syntax and recovery fault injection
        run: |
          bash -n lsposed-module/app/src/main/payload/longvc-control.sh
          bash tests/controller_recovery_test.sh
          bash tests/controller_feeder_test.sh
          bash tests/controller_source_test.sh
      - name: Root lifecycle and protocol tests
        run: |
          set -euo pipefail
          src=lsposed-module/app/src/main/java/com/gushu/longvc
          out=$(mktemp -d)
          javac -d "$out" "$src/RootOperations.java" "$src/StudioOperations.java" "$src/RuntimeState.java" \
            "$src/RootShell.java" tests/jvm/RootLifecycleTest.java
          java -cp "$out" com.gushu.longvc.RootLifecycleTest
      - name: Shared-memory and media geometry tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -pthread \
            tests/camreplace_ring_test.c -o /tmp/camreplace_ring_test
          /tmp/camreplace_ring_test
          g++ -std=c++20 -Wall -Wextra -Werror -pthread \
            -Iengines/camreplace/android/camhook/src \
            tests/native/hook_dispatch_test.cpp -o /tmp/hook_dispatch_test
          /tmp/hook_dispatch_test
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iengines/camreplace/common tests/native/frame_layout_test.cpp \
            -o /tmp/frame_layout_test
          /tmp/frame_layout_test
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iengines/camreplace/common tests/native/pcm_resampler_test.cpp \
            -o /tmp/pcm_resampler_test
          /tmp/pcm_resampler_test
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iengines/camreplace/android/audhook/src tests/native/virtual_mic_gate_test.cpp \
            -o /tmp/virtual_mic_gate_test
          /tmp/virtual_mic_gate_test
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iengines/camreplace/common tests/native/avcc_test.cpp \
            -o /tmp/avcc_test
          /tmp/avcc_test
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iengines/camreplace/common tests/native/adaptive_geometry_test.cpp \
            -o /tmp/adaptive_geometry_test
          /tmp/adaptive_geometry_test
          g++ -std=c++20 -Wall -Wextra -Werror -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Iengines/camreplace/common tests/native/yuv420_nv21_test.cpp \
            -o /tmp/yuv420_nv21_test
          /tmp/yuv420_nv21_test
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iengines/camreplace/android tests/native/sha256_test.cpp -o /tmp/sha256_test
          /tmp/sha256_test
          gcc -std=c11 -Wall -Wextra -Werror -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Iengines/camreplace/android/camhook/src \
            tests/native/nv21_blit_test.c \
            engines/camreplace/android/camhook/src/nv21_blit.c \
            -o /tmp/nv21_blit_test
          /tmp/nv21_blit_test
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iengines/camreplace/android/camhook/src \
            tests/native/raw10_bayer_test.cpp engines/camreplace/android/camhook/src/nv21_blit.c \
            -o /tmp/raw10_bayer_test
          /tmp/raw10_bayer_test
          gcc -std=c11 -Wall -Wextra -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Iengines/camreplace/android/camhook/src tests/native/camera_jpeg_test.c \
            engines/camreplace/android/camhook/src/jpeg_encode.c -lm -o /tmp/camera_jpeg_test
          /tmp/camera_jpeg_test
      - name: Interruptible sockets and RTMP chunks
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -pthread \
            -Iengines/camreplace/android/feed/src tests/native/interruptible_socket_test.cpp \
            -o /tmp/interruptible_socket_test
          timeout 5s /tmp/interruptible_socket_test
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iengines/camreplace/android/feed/src tests/native/rtmp_chunks_test.cpp \
            -o /tmp/rtmp_chunks_test
          /tmp/rtmp_chunks_test
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iengines/camreplace/android/feed/src tests/native/track_freshness_test.cpp \
            -o /tmp/track_freshness_test
          /tmp/track_freshness_test
      - name: Authenticated channel tests
        run: |
          set -euo pipefail
          gcc -std=c99 -Wall -Wextra -Werror -c \
            engines/camreplace/common/secure_channel/vendor/monocypher/monocypher.c \
            -o /tmp/monocypher.o
          g++ -std=c++20 -Wall -Wextra -Werror \
            tests/secure_channel_test.cpp \
            engines/camreplace/common/secure_channel/SecureSession.cpp \
            engines/camreplace/common/secure_channel/LocalTicketAuth.cpp \
            /tmp/monocypher.o -o /tmp/secure_channel_test
          /tmp/secure_channel_test

  mobile-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: android
        uses: ./.github/actions/android-payload
      - name: Build and lint system-scope development APK
        env:
          ANDROID_OUT_DIR: ${{ steps.android.outputs.payload }}
          BUILD_TOOLS: ${{ steps.android.outputs.build-tools }}
          LONGVC_VERSION_CODE: 1
          LONGVC_VERSION_NAME: 0.0.1
        run: |
          set -euo pipefail
          chmod +x lsposed-module/gradlew
          lsposed-module/gradlew --no-daemon -p lsposed-module \
            :app:assembleDebug :app:lintDebug
          apk=lsposed-module/app/build/outputs/apk/debug/app-debug.apk
          bash .github/scripts/verify-android-apk.sh "$BUILD_TOOLS" "$apk" \
            quality "$LONGVC_VERSION_NAME" "$LONGVC_VERSION_CODE"
