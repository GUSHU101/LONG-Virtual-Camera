name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (vMAJOR.MINOR.PATCH)
        required: true
        default: v2.0.0
        type: string
      publish:
        description: Create or update the GitHub release
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  CAMREPLACE_NDK_VERSION: 27.3.13750724

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        name: Validate release version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $REQUESTED_VERSION" >&2
            exit 1
          fi
          echo "value=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"

  android:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android toolchain
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$CAMREPLACE_NDK_VERSION" \
            "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build phone-native ARM64 payload
        run: |
          set -euo pipefail
          cmake -S engines/camreplace/android -B build/camreplace-android \
            -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/engines/camreplace/toolchains/android-ndk.cmake" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$CAMREPLACE_NDK_VERSION" \
            -DCR_FEED_ENABLE_RTMP_DIRECT=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/camreplace-android --parallel 4
          for file in cr_injector cr_feed_proc libcr_hooks.so; do
            test -s "build/camreplace-android/out/$file"
          done
      - name: Build signed LSPosed APK
        env:
          ANDROID_OUT_DIR: ${{ github.workspace }}/build/camreplace-android/out
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SIGNING_STORE_BASE64: ${{ secrets.LONGVC_ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.LONGVC_ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.LONGVC_ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.LONGVC_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export LONGVC_VERSION_NAME="${RELEASE_VERSION#v}"
          if [[ "$RELEASE_VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            major=$((10#${BASH_REMATCH[1]}))
            minor=$((10#${BASH_REMATCH[2]}))
            patch=$((10#${BASH_REMATCH[3]}))
          else
            exit 1
          fi
          if (( major > 2100 || minor > 999 || patch > 999 )); then
            echo 'Android version components exceed versionCode limits' >&2
            exit 1
          fi
          export LONGVC_VERSION_CODE=$((major * 1000000 + minor * 1000 + patch))
          if (( LONGVC_VERSION_CODE < 1 || LONGVC_VERSION_CODE > 2100000000 )); then
            echo "Android versionCode is out of range: $LONGVC_VERSION_CODE" >&2
            exit 1
          fi
          test -n "${SIGNING_STORE_BASE64:-}" || {
            echo 'Production signing secret LONGVC_ANDROID_KEYSTORE_BASE64 is required.' >&2
            exit 1
          }
          test -n "${SIGNING_STORE_PASSWORD:-}"
          test -n "${SIGNING_KEY_ALIAS:-}"
          test -n "${SIGNING_KEY_PASSWORD:-}"
          export LONGVC_SIGNING_STORE_FILE="$RUNNER_TEMP/longvc-release.keystore"
          export LONGVC_SIGNING_STORE_PASSWORD="$SIGNING_STORE_PASSWORD"
          export LONGVC_SIGNING_KEY_ALIAS="$SIGNING_KEY_ALIAS"
          export LONGVC_SIGNING_KEY_PASSWORD="$SIGNING_KEY_PASSWORD"
          printf '%s' "$SIGNING_STORE_BASE64" | base64 --decode > "$LONGVC_SIGNING_STORE_FILE"
          chmod 0600 "$LONGVC_SIGNING_STORE_FILE"
          chmod +x lsposed-module/gradlew
          lsposed-module/gradlew --no-daemon -p lsposed-module \
            :app:assembleRelease :app:lintRelease
          source_apk=lsposed-module/app/build/outputs/apk/release/app-release.apk
          test -s "$source_apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$source_apk"
          python3 tests/verify_apk.py "$source_apk"
          test "$(unzip -p "$source_apk" META-INF/xposed/scope.list | tr -d '\r\n')" = system
          mkdir -p dist
          apk="dist/LONG-Virtual-Camera-${RELEASE_VERSION}-LSPosed-arm64.apk"
          cp "$source_apk" "$apk"
          sha256sum "$apk" | sed 's#  dist/#  #' > "$apk.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LONG-Virtual-Camera-${{ needs.validate.outputs.version }}-LSPosed-arm64
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [validate, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LONG-Virtual-Camera-${{ needs.validate.outputs.version }}-LSPosed-arm64
          path: dist
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_VERSION" dist/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "LONG Virtual Camera $RELEASE_VERSION" --generate-notes
          fi
