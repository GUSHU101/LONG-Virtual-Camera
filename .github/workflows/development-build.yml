name: 01 开发调试版 APK
run-name: 开发调试版 APK · ${{ inputs.version }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 开发调试版版本号（例如 v2.0.43），产物在运行摘要的 Artifacts
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: development-apk-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建开发调试版 · Actions Artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-apk
        with:
          channel: development
          version: ${{ inputs.version }}
          development-store-base64: ${{ secrets.LONGVC_DEVELOPMENT_KEYSTORE_BASE64 }}
          development-store-password: ${{ secrets.LONGVC_DEVELOPMENT_KEYSTORE_PASSWORD }}
