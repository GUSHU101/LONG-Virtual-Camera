name: Android APK build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      production:
        default: false
        type: boolean
    secrets:
      LONGVC_DEVELOPMENT_KEYSTORE_BASE64:
        required: false
      LONGVC_DEVELOPMENT_KEYSTORE_PASSWORD:
        required: false
      LONGVC_ANDROID_KEYSTORE_BASE64:
        required: false
      LONGVC_ANDROID_KEYSTORE_PASSWORD:
        required: false
      LONGVC_ANDROID_KEY_ALIAS:
        required: false
      LONGVC_ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      version:
        value: ${{ jobs.validate.outputs.version }}
      artifact:
        value: ${{ jobs.validate.outputs.artifact }}
      artifact_id:
        value: ${{ jobs.android.outputs.artifact_id }}
      apk_sha256:
        value: ${{ jobs.android.outputs.apk_sha256 }}
      commit:
        value: ${{ jobs.validate.outputs.commit }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
      version_code: ${{ steps.version.outputs.code }}
      channel: ${{ steps.version.outputs.channel }}
      artifact: ${{ steps.version.outputs.artifact }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - id: version
        name: Validate release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          SIGN_PRODUCTION: ${{ inputs.production }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_VERSION" =~ ^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})([.-][0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ||
                ${#REQUESTED_VERSION} -gt 64 ]]; then
            echo "::error::Use vMAJOR.MINOR.PATCH with no leading zeroes, optionally followed by a suffix such as -rc.1." >&2
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          code=$((major * 1000000 + minor * 1000 + patch))
          if (( code < 1 || code > 2100000000 )); then
            echo "Android versionCode is out of range: $code" >&2
            exit 1
          fi
          artifact="LONG-Virtual-Camera-${REQUESTED_VERSION}-LSPosed-arm64"
          if [[ "$SIGN_PRODUCTION" == true ]]; then
            channel=production
          else
            channel=development
            artifact="$artifact-development"
          fi
          printf 'value=%s\ncode=%s\nchannel=%s\nartifact=%s\n' \
            "$REQUESTED_VERSION" "$code" "$channel" "$artifact" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve source commit
        id: source
        run: printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check release tag and availability
        if: inputs.production
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          BUILD_COMMIT: ${{ steps.source.outputs.commit }}
        run: bash .github/scripts/publish-android-release.sh preflight
      - name: Check APK signing secrets
        env:
          APK_CHANNEL: ${{ steps.version.outputs.channel }}
          LONGVC_DEVELOPMENT_KEYSTORE_BASE64: ${{ secrets.LONGVC_DEVELOPMENT_KEYSTORE_BASE64 }}
          LONGVC_DEVELOPMENT_KEYSTORE_PASSWORD: ${{ secrets.LONGVC_DEVELOPMENT_KEYSTORE_PASSWORD }}
          LONGVC_ANDROID_KEYSTORE_BASE64: ${{ secrets.LONGVC_ANDROID_KEYSTORE_BASE64 }}
          LONGVC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LONGVC_ANDROID_KEYSTORE_PASSWORD }}
          LONGVC_ANDROID_KEY_ALIAS: ${{ secrets.LONGVC_ANDROID_KEY_ALIAS }}
          LONGVC_ANDROID_KEY_PASSWORD: ${{ secrets.LONGVC_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$APK_CHANNEL" == production ]]; then
            required=(LONGVC_ANDROID_KEYSTORE_BASE64 LONGVC_ANDROID_KEYSTORE_PASSWORD
                      LONGVC_ANDROID_KEY_ALIAS LONGVC_ANDROID_KEY_PASSWORD)
          else
            required=(LONGVC_DEVELOPMENT_KEYSTORE_BASE64 LONGVC_DEVELOPMENT_KEYSTORE_PASSWORD)
          fi
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository Actions secret $name"
              missing=1
            fi
          done
          if (( missing )); then
            if [[ "$APK_CHANNEL" == production ]]; then
              echo 'To build a development APK, run the Build development APK workflow.' >&2
            fi
            exit 1
          fi

  android:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      apk_sha256: ${{ steps.verify.outputs.apk_sha256 }}
    env:
      APK_CHANNEL: ${{ needs.validate.outputs.channel }}
      ARTIFACT_NAME: ${{ needs.validate.outputs.artifact }}
      LONGVC_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      LONGVC_VERSION_CODE: ${{ needs.validate.outputs.version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - id: android
        uses: ./.github/actions/android-payload
        with:
          gradle-cache: ${{ !inputs.production }}
      - name: Build development LSPosed APK
        if: needs.validate.outputs.channel == 'development'
        env:
          ANDROID_OUT_DIR: ${{ steps.android.outputs.payload }}
          DEVELOPMENT_STORE_BASE64: ${{ secrets.LONGVC_DEVELOPMENT_KEYSTORE_BASE64 }}
          LONGVC_DEVELOPMENT_STORE_PASSWORD: ${{ secrets.LONGVC_DEVELOPMENT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          export LONGVC_VERSION_NAME="${LONGVC_RELEASE_VERSION#v}"
          export LONGVC_DEVELOPMENT_STORE_FILE
          LONGVC_DEVELOPMENT_STORE_FILE=$(mktemp "$RUNNER_TEMP/longvc-development.XXXXXX.p12")
          trap 'rm -f -- "$LONGVC_DEVELOPMENT_STORE_FILE"' EXIT
          if ! printf '%s' "$DEVELOPMENT_STORE_BASE64" | base64 --decode > "$LONGVC_DEVELOPMENT_STORE_FILE"; then
            echo "::error::LONGVC_DEVELOPMENT_KEYSTORE_BASE64 is not valid base64"
            exit 1
          fi
          unset DEVELOPMENT_STORE_BASE64
          test -s "$LONGVC_DEVELOPMENT_STORE_FILE"
          chmod +x lsposed-module/gradlew
          lsposed-module/gradlew --no-daemon -p lsposed-module \
            :app:assembleDebug :app:lintDebug
      - name: Build production-signed LSPosed APK
        if: needs.validate.outputs.channel == 'production'
        env:
          ANDROID_OUT_DIR: ${{ steps.android.outputs.payload }}
          SIGNING_STORE_BASE64: ${{ secrets.LONGVC_ANDROID_KEYSTORE_BASE64 }}
          LONGVC_SIGNING_STORE_PASSWORD: ${{ secrets.LONGVC_ANDROID_KEYSTORE_PASSWORD }}
          LONGVC_SIGNING_KEY_ALIAS: ${{ secrets.LONGVC_ANDROID_KEY_ALIAS }}
          LONGVC_SIGNING_KEY_PASSWORD: ${{ secrets.LONGVC_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export LONGVC_VERSION_NAME="${LONGVC_RELEASE_VERSION#v}"
          export LONGVC_SIGNING_STORE_FILE
          LONGVC_SIGNING_STORE_FILE=$(mktemp "$RUNNER_TEMP/longvc-release.XXXXXX")
          trap 'rm -f -- "$LONGVC_SIGNING_STORE_FILE"' EXIT
          if ! printf '%s' "$SIGNING_STORE_BASE64" | base64 --decode > "$LONGVC_SIGNING_STORE_FILE"; then
            echo "::error::LONGVC_ANDROID_KEYSTORE_BASE64 is not valid base64"
            exit 1
          fi
          unset SIGNING_STORE_BASE64
          test -s "$LONGVC_SIGNING_STORE_FILE"
          chmod +x lsposed-module/gradlew
          lsposed-module/gradlew --no-daemon -p lsposed-module \
            :app:assembleRelease :app:lintRelease
      - name: Verify APK and stage artifact
        id: verify
        env:
          BUILD_TOOLS: ${{ steps.android.outputs.build-tools }}
          PRODUCTION_CERT_SHA256: ${{ vars.LONGVC_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ "$APK_CHANNEL" == production ]]; then
            variant=release
          else
            variant=debug
          fi
          source_apk="lsposed-module/app/build/outputs/apk/$variant/app-$variant.apk"
          bash .github/scripts/verify-android-apk.sh "$BUILD_TOOLS" "$source_apk" \
            "$APK_CHANNEL" "${LONGVC_RELEASE_VERSION#v}" "$LONGVC_VERSION_CODE"
          mkdir -p dist
          apk="$ARTIFACT_NAME.apk"
          cp "$source_apk" "dist/$apk"
          (cd dist && sha256sum --binary "$apk" > "$apk.sha256")
          read -r digest _ < "dist/$apk.sha256"
          printf 'apk_sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.run_attempt == 1 && needs.validate.outputs.artifact || format('{0}-attempt-{1}', needs.validate.outputs.artifact, github.run_attempt) }}
          path: |
            dist/${{ needs.validate.outputs.artifact }}.apk
            dist/${{ needs.validate.outputs.artifact }}.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Record verified APK
        env:
          APK_URL: ${{ steps.upload.outputs.artifact-url }}
          APK_SHA: ${{ steps.verify.outputs.apk_sha256 }}
          BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          printf '## Android APK\n\n[Download %s](%s)\n\nChannel: %s\n\nCommit: \x60%s\x60\n\nAPK SHA-256: \x60%s\x60\n' \
            "$ARTIFACT_NAME" "$APK_URL" "$APK_CHANNEL" "$BUILD_COMMIT" "$APK_SHA" >> "$GITHUB_STEP_SUMMARY"
